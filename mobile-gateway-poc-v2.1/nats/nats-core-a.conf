# nats-core-a — the INTRANET NATS cluster for region-a (the "real" cluster where
# region-a's workers live). Generic stand-in for a home-site cluster.
#
# SINGLE-LEAF-EGRESS design: because ALL sites are joined in one supercluster,
# there is no need for every region's core to dial its own GCP hub. Instead ONE
# core (this one, region-a) is the SINGLE leaf egress point and dials BOTH GCP
# hubs (nats-gcp-a AND nats-gcp-b). A request landing on EITHER GCP hub lands
# here, and this core resolves it locally OR forwards it across the gateway
# (supercluster) to the owning site. region-b's core keeps ONLY its gateway
# (no leaf uplink) — see nats-core-b.conf.
#
# This ONE server therefore holds:
#   1. TWO LEAF uplinks (dials OUT): leafnodes{ remotes } dials BOTH GCP hubs.
#      Intranet dials the internet (firewall-friendly); the GCP hubs only listen.
#   2. GATEWAY (supercluster): gateway{} joins region-a's cluster to region-b's
#      cluster (nats-core-b). Cross-region request/reply + events federate here.
#
# Workers for region-a connect to THIS server (:4222). No JetStream (core NATS).
#
# $GCP_HUB_URL     = the region-a GCP hub's leaf listener (reached via the host).
# $GCP_HUB_URL_B   = the region-b GCP hub's leaf listener (reached via the host).
# $PEER_GW_URL     = region-b's gateway (reached via the host) for the supercluster.

server_name: nats-core-a
listen: 0.0.0.0:4222          # region-a workers connect here
http_port: 8222              # monitoring (/leafz shows the uplinks, /gatewayz the supercluster)

# TWO LEAF uplinks: DIAL OUT to BOTH GCP hubs (intranet -> GCP; firewall-friendly).
# hub:true on each -> even though WE dial, THIS side is the NATS leaf HUB for both
# links, so interest received over EITHER leaf is forwarded to our local cluster
# AND across our gateway (supercluster). This is what lets a client on nats-gcp-b
# (whose leaf lands HERE, not on core-b) still reach region-b's worker via the
# gateway. Without hub:true the dialing side is a "spoke" and would not propagate
# leaf interest to the gateway -> cross-site req/reply + events fail. The GCP nodes
# (nats-gcp-a/b) are the spokes.
leafnodes {
  remotes: [
    { url: $GCP_HUB_URL,   hub: true }
    { url: $GCP_HUB_URL_B, hub: true }
  ]
}

# GATEWAY: supercluster peer = region-b's core cluster.
gateway {
  name: region-a
  listen: 0.0.0.0:7222
  gateways: [
    { name: region-b, url: $PEER_GW_URL }
  ]
}
