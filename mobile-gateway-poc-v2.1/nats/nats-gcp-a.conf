# nats-gcp-a — the GCP-side NATS for region-a (lives in GKE in the real design).
#
# Architecture V2 roles of THIS server:
#   1. Client WebSocket entry point: the region-a nginx reverse proxy tunnels
#      client NATS-over-WebSocket here (/nats -> :8080).
#   2. LEAF HUB: it ACCEPTS an inbound leaf connection that is DIALED from the
#      intranet cluster (nats-core-a). Because company firewalls allow only
#      intranet -> internet, the intranet side dials OUT to here; this server
#      only listens. Once established, traffic flows BOTH ways over that link.
#
# So in NATS terms: this GCP server is the leaf HUB (listen), and the intranet
# nats-core-a is the leaf (remotes). No gateway here — the supercluster lives
# between the two intranet clusters (core-a <-> core-b). No JetStream (core NATS).

server_name: nats-gcp-a
listen: 0.0.0.0:4222          # plain client/debug port
http_port: 8222              # monitoring (/healthz, /leafz, /varz)

# Client WebSocket (nginx tunnels the client's NATS-over-WS to here).
websocket {
  listen: 0.0.0.0:8080
  no_tls: true               # TLS terminated upstream (nginx / Cloud LB) in the demo
}

# LEAF HUB: accept the inbound leaf connection dialed from the intranet.
leafnodes {
  listen: 0.0.0.0:7422
}
