# nats-core-b — the INTRANET NATS cluster for region-b (region-b's workers live
# here). Generic stand-in for a home-site cluster.
#
# SINGLE-LEAF-EGRESS design: region-b's core has NO leaf uplink anymore. The single
# leaf egress point is nats-core-a (which dials BOTH GCP hubs). region-b's core is
# now a PURE SUPERCLUSTER PEER: it only joins the supercluster via its gateway.
# A client that enters on nats-gcp-b reaches region-b's worker like this:
#   client -> nginx-b -> nats-gcp-b -> leaf (to nats-core-a) -> gateway -> nats-core-b
# i.e. region-b's OWN traffic now rides the supercluster to get home, because the
# leaf lands on core-a, not here. (This is the thing Gate B must verify.)
#
# Holds ONLY:
#   GATEWAY (supercluster) to region-a's cluster (nats-core-a) via $PEER_GW_URL.
# Workers for region-b connect to THIS server (:4222). No JetStream (core NATS).

server_name: nats-core-b
listen: 0.0.0.0:4222
http_port: 8222

# NO leafnodes block — region-b does not dial the GCP side (single-leaf-egress).

gateway {
  name: region-b
  listen: 0.0.0.0:7222
  gateways: [
    { name: region-a, url: $PEER_GW_URL }
  ]
}
