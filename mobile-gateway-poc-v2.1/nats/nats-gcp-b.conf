# nats-gcp-b — the GCP-side NATS for region-b (lives in GKE in the real design).
# Identical role to nats-gcp-a, for region-b: client WebSocket entry + leaf HUB
# that ACCEPTS the inbound leaf dialed from the intranet cluster (nats-core-b).
# No gateway here; no JetStream (core NATS only).

server_name: nats-gcp-b
listen: 0.0.0.0:4222
http_port: 8222

websocket {
  listen: 0.0.0.0:8080
  no_tls: true
}

leafnodes {
  listen: 0.0.0.0:7422
}
