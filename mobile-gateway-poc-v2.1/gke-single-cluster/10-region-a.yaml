# GKE single-cluster — REGION-A (namespace region-a). V2.1 GCP side only:
# nats-gcp-a (client WS + leaf HUB listener) + leaf LoadBalancer + mobile-gateway
# (HTTP->NATS bridge) + nginx + proxy LB + client Job. Intranet nats-core-a/rest-nats/
# worker + the NATS ADAPTER run on the VM (k8s/intranet/). V2.1: nginx /api/ ->
# mobile-gateway (in-cluster) -> nats-gcp:4222 -> leaf -> intranet (A1 RETIRED: no
# direct nginx->intranet-REST hop, so __INTRANET_REST_A__ is GONE).
# Replace __AR_IMAGE_PREFIX__ before applying.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-gcp-conf
  namespace: region-a
data:
  nats.conf: |
    server_name: nats-gcp-a
    listen: 0.0.0.0:4222
    http_port: 8222
    websocket { listen: 0.0.0.0:8080
      no_tls: true }
    leafnodes { listen: 0.0.0.0:7422 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-gcp
  namespace: region-a
spec:
  replicas: 1
  selector: { matchLabels: { app: nats-gcp } }
  template:
    metadata: { labels: { app: nats-gcp } }
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - { containerPort: 4222, name: client }
            - { containerPort: 8080, name: ws }
            - { containerPort: 7422, name: leaf }
            - { containerPort: 8222, name: monitor }
          volumeMounts: [ { name: conf, mountPath: /etc/nats } ]
          resources:
            requests: { cpu: 40m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: conf
          configMap: { name: nats-gcp-conf, items: [ { key: nats.conf, path: nats.conf } ] }
---
apiVersion: v1
kind: Service
metadata:
  name: nats-gcp
  namespace: region-a
spec:
  selector: { app: nats-gcp }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }   # mobile-gateway connects here
    - { name: ws, port: 8080, targetPort: 8080 }
    - { name: monitor, port: 8222, targetPort: 8222 }
---
# TCP LoadBalancer for the LEAF port so the INTRANET nats-core-a dials IN (the one
# inbound-to-GCP endpoint). Lock loadBalancerSourceRanges to the intranet egress in prod.
apiVersion: v1
kind: Service
metadata:
  name: nats-gcp-leaf
  namespace: region-a
spec:
  type: LoadBalancer
  selector: { app: nats-gcp }
  ports: [ { name: leaf, port: 7422, targetPort: 7422 } ]
  # Lock the leaf LB to the intranet egress so ONLY the intranet can dial it in
  # (firewall-direction enforcement). Fill __INTRANET_EGRESS_CIDR__ with the company
  # NAT CIDR in prod (POC = the intranet VM's public IP, e.g. 34.81.245.171/32).
  # For an initial smoke test with no lock, replace the placeholder with the egress CIDR (we ran open first,
  # then locked it to the VM IP as a separate test).
  loadBalancerSourceRanges: [ "__INTRANET_EGRESS_CIDR__" ]
---
# Mobile-gateway (GCP side): HTTP->NATS bridge behind nginx /api/*, in front of the
# leaf hub. Connects to nats-gcp:4222 and does one nc.Request(demo.bootstrap.request).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-gateway
  namespace: region-a
spec:
  replicas: 1
  selector: { matchLabels: { app: mobile-gateway } }
  template:
    metadata: { labels: { app: mobile-gateway } }
    spec:
      containers:
        - name: mobile-gateway
          image: __AR_IMAGE_PREFIX__/mobile-gateway:v1
          env:
            - { name: REGION, value: region-a }
            - { name: NATS_URL, value: "nats://nats-gcp.region-a.svc.cluster.local:4222" }
            - { name: REQUEST_SUBJECT, value: "demo.bootstrap.request" }
          ports: [ { containerPort: 8080 } ]
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mobile-gateway
  namespace: region-a
spec:
  selector: { app: mobile-gateway }
  ports: [ { port: 8080, targetPort: 8080 } ]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: region-a
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/nginx-client-body;
      proxy_temp_path /tmp/nginx-proxy;
      fastcgi_temp_path /tmp/nginx-fastcgi;
      uwsgi_temp_path /tmp/nginx-uwsgi;
      scgi_temp_path /tmp/nginx-scgi;
      upstream mobile_gateway  { server mobile-gateway.region-a.svc.cluster.local:8080; }
      upstream nats_ws_backend { server nats-gcp.region-a.svc.cluster.local:8080; }
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      proxy_connect_timeout 10s;
      proxy_send_timeout 75s;
      proxy_read_timeout 75s;
      server {
        listen 8080;
        location = /healthz { return 200 "proxy region-a ok\n"; add_header Content-Type text/plain; }
        location /nats {
          proxy_pass http://nats_ws_backend;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
        location /api/ {
          proxy_pass http://mobile_gateway;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: region-a
spec:
  replicas: 1
  selector: { matchLabels: { app: nginx } }
  template:
    metadata: { labels: { app: nginx } }
    spec:
      initContainers:
        - name: wait-for-upstreams
          image: nats:2.10-alpine
          command: ["sh","-c","until getent hosts mobile-gateway.region-a.svc.cluster.local && getent hosts nats-gcp.region-a.svc.cluster.local; do echo waiting; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 32Mi }
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          ports: [ { containerPort: 8080 } ]
          volumeMounts: [ { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf } ]
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 128Mi }
      volumes:
        - name: conf
          configMap: { name: nginx-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: region-a
spec:
  type: LoadBalancer
  selector: { app: nginx }
  ports: [ { port: 80, targetPort: 8080 } ]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: client-region-a
  namespace: region-a
spec:
  backoffLimit: 2
  template:
    metadata: { labels: { app: client } }
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: __AR_IMAGE_PREFIX__/super-client:v1
          env:
            - { name: REST_BASE_URL, value: "http://proxy.region-a.svc.cluster.local" }
            - { name: NATS_WS_URL,   value: "ws://proxy.region-a.svc.cluster.local/nats" }
            - { name: LOCAL_REGION,  value: "region-a" }
            - { name: REMOTE_REGION, value: "region-b" }
            - { name: EVENT_WAIT,    value: "15s" }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
